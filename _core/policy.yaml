# Sample configuration. Review operating policy and actual schemas before use.
# Shared values live here. Shared sentence rules live in _core/rules.md.
salesforce:
  instance_url: https://crm.example.invalid
  record_url: '{instance_url}/lightning/r/{Object}/{Id}/view'
  record_url_objects:
  - Task
  - Contact
  - Opportunity
  - Account
  note_prefix: 'M/D/YY SR - '
  cooldown_marker: M/D/YY SR - Recycled. Cooldown until M/D/YY.
  calendar_call_marker: Calendar {event_id}
  manual_call_marker: Phone {call_date} {contact_id}
  call_marker: Momentum {meeting_id}
  validation_rules:
  - Stage move out of S0 fails unless LeadSource is set
  - Closed Won fails unless Closed_Won_Notes__c is at least close.win_note_min_chars
followup:
  next_date_days_active: 1
  next_date_days_cold: 2
  sent_mail_hold_days_cold: 2            # elapsed 24-hour periods since Operator's latest actual sent email. Equality releases the hold
  sent_mail_hold_days_active: 1          # same elapsed-time rule for an active Contact. Never compare date-only values
  breakup_after_unanswered: 8 # unanswered sent emails since the last substantive reply before the break-up note
  recycle_after_unanswered: 9 # cold Contacts only: unanswered emails, including the break-up note, before a Recycle decision
  cooldown_days: 30
email_voice:
  greeting: Hi {FirstName},
  closing: 'Best,

    Operator'
  reply_in_thread: true
  bcc: false
  collateral_path: _core/collateral
  computer_sender: assistant@seller.example
  banned:
  - canned meeting asks
  - just checking in
  - circling back
tooling:
  slack_lookback_days: 14          # Slack DM and shared-channel window per deal or contact (pipeline-review, forecast-weekly, task-triage-speed-run)
  gmail_search_max_addresses: 3
  calendar_lookback_days: 30
  calendar_lookahead_days: 30
  calendar_result_cap: 50
  internal_domains: [seller.example, seller-tools.example]  # never a buyer; excluded from attendee, inbox, roster, and contact-stat reads
  generic_email_domains:
  - gmail.com
  - googlemail.com
  - yahoo.com
  - hotmail.com
  - outlook.com
  - live.com
  - msn.com
  - aol.com
  - icloud.com
  - me.com
  - mac.com
  - protonmail.com
  - proton.me
  - comcast.net
  - verizon.net
  - att.net
  - sbcglobal.net
  - linkedin.com
  org_lookup_tool: get_enterprise_org_info
  scripts:
    event_list_prep: workspaces/prospecting/workflows/event-sequence/scripts/event_list_prep.py
    event_launch_check: workspaces/prospecting/workflows/event-sequence/scripts/launch_check.py
    event_scrub_leads: workspaces/prospecting/workflows/event-sequence/01-list-prep/scripts/scrub_leads.py
    event_make_batches: workspaces/prospecting/workflows/event-sequence/01-list-prep/scripts/make_batches.py
    prospect_common: workspaces/prospecting/scripts/prospect_common.py
    prospect_evidence_gate: workspaces/prospecting/scripts/prospect_evidence_gate.py
    prospect_account_route: workspaces/prospecting/scripts/prospect_account_route.py
    prospect_privacy_check: workspaces/prospecting/scripts/prospect_privacy_check.py
    prospect_readback_check: workspaces/prospecting/scripts/prospect_readback_check.py
    prospect_scan_verdict: workspaces/prospecting/workflows/signal-prospecting/01-research/scripts/prospect_scan_verdict.py
    prospect_outreach_gate: workspaces/prospecting/workflows/signal-prospecting/02-outreach/scripts/prospect_outreach_gate.py
    prospect_followup_gate: workspaces/prospecting/workflows/signal-prospecting/03-followup/scripts/prospect_followup_gate.py
    prospect_adoption_lookup: workspaces/prospecting/workflows/signal-prospecting/01-research/scripts/adoption_lookup.sql
    hygiene_check: _core/scripts/hygiene_check.py
    coverage_check: _core/scripts/coverage_check.py
    workflow_revision_check: _core/scripts/workflow_revision_check.py
    gmail_digest: _core/scripts/gmail_thread_digest.py
    forecast_math: workspaces/forecasting/workflows/forecast-weekly/scripts/forecast_math.py
    forecast_deck: workspaces/forecasting/workflows/forecast-weekly/scripts/forecast_deck.py
    pipeline_render: workspaces/pipeline/workflows/pipeline-review/scripts/pipeline_render.py
    top_actions: workspaces/pipeline/scripts/top_actions.py
    deal_thread_match: workspaces/pipeline/scripts/deal_thread_match.py
    task_reschedule_check: workspaces/pipeline/scripts/task_reschedule_check.py
    gmail_contact_stats: workspaces/pipeline/scripts/gmail_contact_stats.py
    closeout_check: workspaces/pipeline/workflows/task-triage-speed-run/scripts/closeout_check.py
    pilot_usage_build: workspaces/pipeline/workflows/pilot-usage/scripts/build_pilot_usage_report.py
    pilot_resolve: workspaces/pipeline/workflows/pilot-usage/scripts/resolve_pilot.py
    account_usage: workspaces/pipeline/scripts/account_usage.py
    customer_review: workspaces/pipeline/workflows/customer-review/scripts/customer_review.py
    forecast_notify: workspaces/forecasting/workflows/forecast-weekly/scripts/forecast_notify.py
    onboard: _core/scripts/onboard.py
    rehearse: _core/scripts/rehearse.py
  governing_revision:
    repository: null
    remote: origin
    branch: main
call_prep:
  schedule:
    days:
    - MO
    - TU
    - WE
    - TH
    - FR
    time: 06:30
    tz: America/Los_Angeles
  audio:
    voice: charon
    filename: daily-call-prep-{date}.mp3
  history_days: 90                     # Salesforce activity lookback. Momentum uses momentum.lookback_days
  research_sources_max: 5
  call_type:
    customer: Closed Won or active pilot
    proposal: a proposal or pilot was sent
    demo: a demo was promised or scheduled
    discovery: one or more completed calls, no proposal
    intro: no completed live call
  expected_information:
    intro:
    - target workflow
    - primary users
    - current tools
    - why now
    - decision owner
    discovery:
    - target workflow
    - primary users
    - current process
    - required data sources
    - security constraints
    - success measure
    - budget owner
    - timeline
    demo:
    - chosen workflow to show
    - who evaluates
    - evaluation criteria
    - data access for the demo
    - next step after demo
    proposal:
    - written feedback on proposal
    - security or legal status
    - procurement path
    - seat count
    - start date
    - signer
    customer:
    - adoption by team
    - blockers
    - expansion owner
    - renewal date
    - open support items
momentum:
  attendee_email: rep@seller.example
  display_tz: America/Los_Angeles
  window_days: 3
  lookback_days: 30
  max_page: 1
  sweep:
    page_size: 50
    window_hours: 3
coach:
  schedule:
    call_review:
      days:
      - MO
      - TU
      - WE
      - TH
      - FR
      time: 08:15
      tz: America/Los_Angeles
    deal_review:
      days:
      - MO
      time: 09:00
      tz: America/Los_Angeles
    pre_meeting:
      days:
      - MO
      - TU
      - WE
      - TH
      - FR
      time: '15:00'
      tz: America/Los_Angeles
    criteria_refresh:
      days:
      - FR
      week_of_month: 1
      time: '15:30'
      tz: America/Los_Angeles
  stage_gate_minimums:
    S2:
      pain: 2
      champion: 1
      metrics: 1
    S3:
      economic_buyer: 2
      decision_process: 2
      metrics: 2
      champion: 2
    S4:
      metrics: 3
      decision_criteria: 2
    S5:
      paper_process: 3
      economic_buyer: 3
  deal_review_count: 5
  rep_talk_share_flag_percent: 55
interaction:
  max_buyer_quotes: 8
  amount_source:
  - buyer_confirmed
  - user_supplied
pipeline:
  triage:
    meeting_lookahead_business_days: 10
    prep_lead_business_days: 2
  customer_review:                 # Closed Won customer milestone reviews. Not ARR growth
    schedule: {days: [MO], week_of_month: 1, time: "07:30", tz: America/Los_Angeles}
    milestone_months: [3, 6, 12]   # calendar months after the customer's first verified non-trial Closed Won
    expansion_type: Existing Business
    expansion_stage: S1
  stages: [S2, S3, S4, S5]         # hygiene scope. S0 and S1 get the Friday qualification pass only
  early_stages: [S0, S1]           # Friday qualification pass, Closed Lost per closed_lost_silence_days
  early_required_fields:
    S1: [Amount]                   # quota ARR needs a deal size by S1
  close_warning_days: 14
  date_at_risk_below_stage: S3
  stale_days: 14
  worth_growing_min_employees: null
  closed_lost_silence_days: 30
  activity_query_days: 30
  inbound_subject_prefix: 'Email: <<'
  triggers:
    next_passed: next-step due date before today
    new_activity: buyer email or held meeting after the newest note
    blank_field: required field or next-step entry missing or malformed
    date_at_risk: CloseDate past or near while below date_at_risk_below_stage
    stale: no activity within stale_days and no live next step
    task_gap: not exactly one current-action Task on the next-step date, excluding later scheduled-Event milestone candidates
      pending review (rules#followup_task)
  required_fields:
    S2:
    - Amount
    - LeadSource
    - Customer_Type__c
    - Deal_Type__c
    - Customer_Point_of_Contact__c
    - Competitors__c
    S3:
    - Subscription_Type__c
    - Contract_Status__c
    S4: []
    S5:
    - Contract_Sent__c
  conditional_fields:
  - field: Trial_Expiration_Date__c
    when:
      Deal_Type__c: Paid Trial
  stage_entry:
    S2: BANT confirmed, decision maker identified, demo done or scheduled
    S3: solution defined, pricing agreed in principle, technical validation underway, buyer verbal commit to proceed
    S4: 'quote presented, legal or procurement engaged, no open technical blockers; or an active pilot, POC, or trial, paid
      or unpaid, in any source (example rule: any active pilot below S4 proposes S4)'
    S5: testing complete with positive results, ready for contract; contract sent or in legal review
  note_next_line: M/D/YY SR - <next action in one sentence, due on or by M/D[/YY]>
  note_history_line: M/D/YY SR - <what happened since the last note, two sentences at most>
  internal_ask_nudge_business_days: 2
  schedule:
    watch_sync:
      days:
      - MO
      - TU
      - WE
      - TH
      - FR
      time: 06:15
      tz: America/Los_Angeles
    call_sweep:
      days:
      - MO
      - TU
      - WE
      - TH
      - FR
      time: 06:45
      tz: America/Los_Angeles
    task_triage:
      days:
      - MO
      - TU
      - WE
      - TH
      - FR
      time: 07:30
      tz: America/Los_Angeles
    ask_nudges:
      days:
      - MO
      - TU
      - WE
      - TH
      - FR
      time: 09:00
      tz: America/Los_Angeles
    friday:
      days:
      - FR
      time: 09:00
      tz: America/Los_Angeles
forecast:
  manager_update:
    days:
    - FR
    time: '12:00'
    tz: America/Los_Angeles
  quarters: calendar
  amount_field: ARR__c
  open_min_stage: S2
  targets: {}
  target_default: 250000
  deck:
    presentation_id: null
    slide_title: Sales Operator  |  {quarter} New Business Bookings Plan
    core_rows: 5
    backup_rows: 4
    cell_character_cap: 32
    name_character_cap: 14
    core_risk_character_cap: 24
  tracking:
    forward_quarters: 2
    created_arr_window_days: 7
    coverage_min: 3
    pace_behind_alert_percent: 15
    pace_report:
      days:
      - MO
      time: 08:00
