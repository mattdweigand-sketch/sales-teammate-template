close:
  signature_evidence:
  - Paid_Contract_Signed__c = true
  - Ironclad_Contract_Signed__c = true with ironclad_Contract_Signed_Date__c
  - Signed_Contract_URL__c set
  - a signed PDF the user supplies
  - the user states signed in this thread
  path_order:
  - 2
  - 3
  - 4
  - 5
  - 1
  customer_type_stop:
  - Sovereign AI
  win_note_min_chars: 50
  win_note_max_chars: 280
  followup_days: 7
  ops_channel: C0000000001
  ops_owners:
  - U0000000001
  - U0000000002
  deal_desk_channel: C0000000002
  terms_default:
    type: New Business
    billing_interval: Annual
    billing_terms: Net 30
    contract_term_months: 12
    subscription_type: Paid
  price_books:
    annual:
      name: Standard Price Book
      annual_list:
        max: 1200
        pro: 600
    pilot:
      name: Monthly Price Book
      monthly_list:
        max: 100
        pro: 50
  credits:
    product: Example Product Credits
    unit_price: 0.01
    discount: 0
    bonus_product: Example Product Bonus Credits
    bonus_unit_price: 0
  paid_pilot:
    deal_type: Paid Trial
    price_book: pilot
    discount: 0
    contract_term: pilot length in months
    subscription_type: Paid
  handoff_when:
  - self-serve org exists
  - more than one org
  - setup_trial declined or failed
  - Netsuite_Sync_Status__c FAILED
  - ADMIN_Error_Message__c set
  setup_trial:
    trial_days: 1
    tier_default: pro
    flow_name: Example_Create_Organization
    payload:
      Subscription_Type__c: Trial
      Subscription_Billing_Interval__c: Annual
      Subscription_Start_Date__c: today
      Subscription_Deactivation_Date__c: today + trial_days
      Trial_Expiration_Date__c: today + trial_days
      Admin_Email__c: admin Contact email
      Admin_Invite_Tier__c: tier_default
      Sync_Free_Trial_to_ADMIN__c: true
    poll:
      every_seconds: 15
      max_seconds: 60
    success_fields:
      ADMIN_Error_Message__c: null
      Admin_Org_Subscription_Id__c: set
      Account.Admin_Organization_UUID__c: set
    restore_after:
    - Subscription_Type__c
    - Subscription_Billing_Interval__c
    - Subscription_Start_Date__c
    - Subscription_Deactivation_Date__c
    - Trial_Expiration_Date__c
prospecting:
  identity:
    owner_email: rep@seller.example
    sfdc_user_id: 005000000000001AAA
    timezone: America/Los_Angeles
  approval:
    unattended_writes: false
    readback_required: true
    never:
    - send email outside rules#event_sequence
    - create Opportunity
    - change deal stage or amount
  salesforce:
    open_opportunity: IsClosed = false
  scan:
    quote_min_words: 5
    max_signals_per_account: 3
    warm_engagement:
      task_subject_markers:
      - 'Re:'
      - 'Email: << Re:'
      - 'Email: >> Re:'
      task_owner: not identity.sfdc_user_id
      ignored_owner_ids: []
  warehouse:
    name: EXAMPLE_READONLY_WH
    data_lag_days: 1
    forbidden:
    - user names
    - user emails
    - user or seat counts
    - query content
    - activity timing
  user_scan:
    statements:
      org_adopted: Example Product is already adopted at the organization.
      individuals_only: People at the organization already pay for Example Product individually.
    adoption_values:
    - org_adopted
    - individuals_only
    - none_found
    bundle_keys:
      account_name: str
      salesforce_account_id: str
      account_domain: str
      data_through_date: str
      mapped_org_count: int
      org_subscribed: bool
      org_paying: bool
      org_service_types: list
      org_platforms: list
      paid_individuals_exist: bool
      adoption: str
  event:
    exclude:
    - open_opportunity
    - outside_named_accounts
    - recent_reply
    - unverified_email
    - catch_all_email
    - active_sequence
    - event_app_invite
    recent_reply_days: 14
    enrich: missing_or_unverified
    enrich_order:
    - apollo_match
    - apollo_waterfall
    stop_on_reply: true
    steps:
    - email
    - email
    - linkedin_task
    step_gap_days: 3
    last_touch_before_event_days: 2
    outreach_owner_scope:
      house_owner_ids: []
      include_missing_account: false
  outreach:
    bundle_checked_max_age_hours: 24
    suppression_days: 30
    suppressing_task_subtypes:
    - Email
    - Call
    activity_lookback_days: 30
    max_drafts_per_run: 1
    recipient_sources:
    - existing Salesforce Contact with Email
    - prior Gmail thread with the person
    - Apollo verified
    - Operator supplied in this conversation
    draft_shape: One verified observation, one relevant Example Product connection, one easy question. A few plain sentences;
      no self-introduction line such as "I work for Example Product"; no unsupported assumptions or benchmark statistics.
    lint: optional environment style review
  followup:
    due_calendar_days: 7
    max_tasks_per_run: 1
    task:
      Subject: 'Follow up: {gmail_subject}'
      Status: Not Started
      Priority: Normal
      TaskSubtype: Task
      Description: Follow up on signal-outreach email. Gmail message {message_id}; thread {thread_id}. signal_type {signal_type};
        angle {angle}.
    closed_statuses:
    - Completed
    - Deferred
system_review:
  schedule:
    days:
    - FR
    time: '14:00'
    tz: America/Los_Angeles
  preapproval:
    window_weeks: 4
    min_proposals: 20
    min_unchanged: 19
    max_rejections: 0
template:
  mode: unconfigured
  external_ready: false
  integrations: {}
  company_name: Example Seller
  owner_name: Sales Operator
  product_name: Example Product
  product_value: Example Product helps a team coordinate a recurring business workflow.
  product_evidence: Fictional demonstration only. No verified product claim.
  product_review_date: '2026-10-04'
  icp: Business services with a recurring team workflow, named owner and measurable evaluation. Demo only.
  warehouse_timezone: America/Los_Angeles
  operating_policy_review: null
