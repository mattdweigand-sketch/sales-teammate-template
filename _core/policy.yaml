# Data shared by sales workflows. Owner: Sales Operator.
# This file holds values: thresholds, dates, IDs, field lists, templates. Rules that need a
# sentence live in _core/rules.md when shared, otherwise in the owning workflow folder. Change values here.
# Skills read the blocks they name at run start.

salesforce:
  instance_url: https://crm.example.invalid
  record_url: "{instance_url}/lightning/r/{Object}/{Id}/view"
  record_url_objects: [Task, Contact, Opportunity, Account]
  note_prefix: "M/D/YY SR - "          # prepended to Description and note fields; existing text stays below (rules#note_prefix)
  cooldown_marker: "M/D/YY SR - Recycled. Cooldown until M/D/YY."
  calendar_call_marker: "Calendar {event_id}"  # stable Calendar fallback; interaction-sync owns marker selection
  call_marker: "Momentum {meeting_id}"    # dedupe key for logged calls; line 1 of Task Description. Legacy records may carry it in Subject
  validation_rules:
    - "Stage move out of S0 fails unless LeadSource is set"                 # example CRM validation requirement
    - "Closed Won fails unless Closed_Won_Notes__c is at least close.win_note_min_chars"   # crm-guide rule 5a

followup:
  next_date_days_active: 1               # Task date after a draft to an active Contact; active and cold per rules#contact_status
  next_date_days_cold: 2                 # Task date after a draft to a cold Contact
  sent_mail_hold_days_cold: 2            # no new draft to a cold Contact if Operator emailed within this window
  sent_mail_hold_days_active: 1          # same for an active Contact
  recycle_after_unanswered: 7            # cold Contacts only: distinct unanswered sent emails before a Push or Recycle decision
  cooldown_days: 30                      # Contact cooldown after recycle; also the Push distance

email_voice:                             # writing rules: rules#email_body; interaction-sync owns attachments
  greeting: "Hi {FirstName},"
  closing: "Best,\nOperator"
  reply_in_thread: true
  bcc: false
  collateral_path: _core/collateral
  computer_sender: assistant@seller.example   # a quoted message from this sender carries internal notes
  banned: [canned meeting asks, "just checking in", "circling back"]

tooling:
  slack_lookback_days: 14          # Slack DM and shared-channel window per deal or contact (pipeline-review, forecast-weekly, task-triage-speed-run)
  gmail_search_max_addresses: 3        # more per call returns near-empty results for most addresses
  calendar_lookback_days: 30
  calendar_lookahead_days: 30
  calendar_result_cap: 50              # search_calendar returns at most this many events and has no cursor; a page at the cap is incomplete (rules#calendar_search)
  internal_domains: [seller.example, seller-tools.example]   # never a buyer; excluded from attendee, inbox, roster, and contact-stat reads
  generic_email_domains: [gmail.com, googlemail.com, yahoo.com, hotmail.com, outlook.com, live.com, msn.com, aol.com, icloud.com, me.com, mac.com, protonmail.com, proton.me, comcast.net, verizon.net, att.net, sbcglobal.net, linkedin.com]   # a Contact on one of these never defines an Account domain (coverage_check)
  org_lookup_tool: get_enterprise_org_info            # admin_support_team connector; input email; fields and 404 meaning in rules#org_lookup
  # Deterministic helpers live at their narrowest shared scope. Skills name a script by its key, never by path. Keys resolve paths across core, workspace and workflow scripts/. Interfaces in _core/scripts/CONTEXT.md
  scripts:
    onboard: _core/scripts/onboard.py
    rehearse: _core/scripts/rehearse.py
    event_list_prep: workspaces/prospecting/workflows/event-sequence/scripts/event_list_prep.py
    event_scrub_leads: workspaces/prospecting/workflows/event-sequence/01-list-prep/scripts/scrub_leads.py
    event_make_batches: workspaces/prospecting/workflows/event-sequence/01-list-prep/scripts/make_batches.py
    prospect_common: workspaces/prospecting/scripts/prospect_common.py
    prospect_evidence_gate: workspaces/prospecting/scripts/prospect_evidence_gate.py
    prospect_account_route: workspaces/prospecting/scripts/prospect_account_route.py
    prospect_privacy_check: workspaces/prospecting/scripts/prospect_privacy_check.py
    prospect_readback_check: workspaces/prospecting/scripts/prospect_readback_check.py
    prospect_scan_verdict: workspaces/prospecting/workflows/signal-prospecting/01-research/scripts/prospect_scan_verdict.py
    prospect_outreach_gate: workspaces/prospecting/workflows/signal-prospecting/02-outreach/scripts/prospect_outreach_gate.py
    prospect_followup_gate: workspaces/prospecting/workflows/signal-prospecting/03-followup/scripts/prospect_followup_gate.py
    prospect_adoption_lookup: workspaces/prospecting/workflows/signal-prospecting/01-research/scripts/adoption_lookup.sql
    hygiene_check: _core/scripts/hygiene_check.py
    coverage_check: _core/scripts/coverage_check.py
    gmail_digest: _core/scripts/gmail_thread_digest.py
    forecast_math: workspaces/forecasting/workflows/forecast-weekly/scripts/forecast_math.py
    pipeline_render: workspaces/pipeline/workflows/pipeline-review/scripts/pipeline_render.py
    gmail_contact_stats: workspaces/pipeline/scripts/gmail_contact_stats.py
    closeout_check: workspaces/pipeline/workflows/task-triage-speed-run/scripts/closeout_check.py
    pilot_usage_build: workspaces/pipeline/workflows/pilot-usage/scripts/build_pilot_usage_report.py
    pilot_resolve: workspaces/pipeline/workflows/pilot-usage/scripts/resolve_pilot.py
    account_usage: workspaces/pipeline/scripts/account_usage.py
    customer_review: workspaces/pipeline/workflows/customer-review/scripts/customer_review.py
    forecast_notify: workspaces/forecasting/workflows/forecast-weekly/scripts/forecast_notify.py

call_prep:
  schedule:       {days: [MO, TU, WE, TH, FR], time: "06:30", tz: America/Los_Angeles}
  audio:
    voice: charon
    filename: "daily-call-prep-{date}.mp3"
  history_days: 90                     # Salesforce activity and Momentum lookback
  research_sources_max: 5              # dated public sources per company
  call_type:                           # inferred from evidence, tested in this order, first match wins (rules#call_type)
    customer:  "Closed Won or active pilot"
    proposal:  "a proposal or pilot was sent"
    demo:      "a demo was promised or scheduled"
    discovery: "one or more completed calls, no proposal"
    intro:     "no completed live call"
  expected_information:
    intro:        [target workflow, primary users, current tools, why now, decision owner]
    discovery:    [target workflow, primary users, current process, required data sources, security constraints, success measure, budget owner, timeline]
    demo:         [chosen workflow to show, who evaluates, evaluation criteria, data access for the demo, next step after demo]
    proposal:     [written feedback on proposal, security or legal status, procurement path, seat count, start date, signer]
    customer:     [adoption by team, blockers, expansion owner, renewal date, open support items]

momentum:                                # call transcripts, shared by interaction-sync and sales-call-prep (rules#momentum)
  attendee_email: rep@seller.example   # filter attendees on this address, not the org skill default
  display_tz: America/Los_Angeles
  window_days: 3                         # max date span per request (rate limit); from/to required
  lookback_days: 30                      # max total lookback per Account per run, overrides any skill history window
  max_page: 1
  sweep:
    page_size: 50
    window_hours: 3

coach:
  schedule:
    call_review: {days: [MO, TU, WE, TH, FR], time: "08:15", tz: America/Los_Angeles}
    deal_review: {days: [MO], time: "09:00", tz: America/Los_Angeles}
    pre_meeting: {days: [MO, TU, WE, TH, FR], time: "15:00", tz: America/Los_Angeles}
    criteria_refresh: {days: [FR], week_of_month: 1, time: "15:30", tz: America/Los_Angeles}
  stage_gate_minimums:
    S2: {pain: 2, champion: 1, metrics: 1}
    S3: {economic_buyer: 2, decision_process: 2, metrics: 2, champion: 2}
    S4: {metrics: 3, decision_criteria: 2}
    S5: {paper_process: 3, economic_buyer: 3}
  deal_review_count: 5
  rep_talk_share_flag_percent: 55

interaction:
  max_buyer_quotes: 8
  amount_source: [buyer_confirmed, user_supplied]   # never a booking form or seat wish (interaction-sync)

pipeline:
  triage:
    meeting_lookahead_business_days: 10
    prep_lead_business_days: 2
  customer_review:                 # Closed Won customer milestone reviews and renewal notices. Not ARR growth
    schedule: {days: [MO], week_of_month: 1, time: "07:30", tz: America/Los_Angeles}
    milestone_months: [3, 6, 12]   # calendar months after the customer's first verified non-trial Closed Won
    renewal_notice_days: 90        # renewal Task this many days before the subscription end date
    expansion_type: Existing Business
    expansion_stage: S1
  stages: [S2, S3, S4, S5]         # hygiene scope. S0 and S1 get the Friday qualification pass only
  early_stages: [S0, S1]           # Friday qualification pass, Closed Lost per closed_lost_silence_days
  early_required_fields:
    S1: [Amount]                   # quota ARR needs a deal size by S1
  close_warning_days: 14           # CloseDate this near while below date_at_risk_below_stage = date_at_risk
  date_at_risk_below_stage: S3
  stale_days: 14                   # no Task or Event this long = stale
  closed_lost_silence_days: 30     # buyer silence with no upcoming Event before a Closed Lost proposal
  activity_query_days: 30          # Task and Event window read per deal
  inbound_subject_prefix: "Email: <<"   # logged inbound email Task Subject
  triggers:                        # names hygiene_check emits; definitions in workspaces/pipeline/workflows/pipeline-review/references/triggers.md
    next_passed:   next-step due date before today
    new_activity:  buyer email or held meeting after the newest note
    blank_field:   required field or next-step entry missing or malformed
    date_at_risk:  CloseDate past or near while below date_at_risk_below_stage
    stale:         no activity within stale_days and no live next step
    task_gap:      not exactly one current-action Task on the next-step date, excluding later scheduled-Event milestone candidates pending review (rules#followup_task)
  # Required fields by stage, S2 and up, cumulative. Sample custom fields, verify actual describe during deployment.
  required_fields:
    S2: [Amount, LeadSource, Customer_Type__c, Deal_Type__c, Customer_Point_of_Contact__c, Competitors__c]   # Competitors__c: None when there is none
    S3: [Subscription_Type__c, Contract_Status__c]
    S4: []
    S5: [Contract_Sent__c]         # boolean; blank means false
  conditional_fields:
    - field: Trial_Expiration_Date__c   # pilot end date
      when: {Deal_Type__c: Paid Trial}
  # Entry criterion per stage. Source: configured-crm-guide stage table. Deviation marked SR. Move rule: rules#stage_move
  stage_entry:
    S2: "BANT confirmed, decision maker identified, demo done or scheduled"
    S3: "solution defined, pricing agreed in principle, technical validation underway, buyer verbal commit to proceed"
    S4: "quote presented, legal or procurement engaged, no open technical blockers; or an active pilot, POC, or trial, paid or unpaid, in any source (example rule: any active pilot below S4 proposes S4)"
    S5: "testing complete with positive results, ready for contract; contract sent or in legal review"
  note_next_line: "M/D/YY SR - <next action in one sentence, due on or by M/D[/YY]>"    # writing rules: rules#next_steps
  note_history_line: "M/D/YY SR - <what happened since the last note, two sentences at most>"
  schedule:                        # run behaviour: rules#scheduled_runs
    watch_sync:   {days: [MO, TU, WE, TH, FR], time: "06:15", tz: America/Los_Angeles}
    call_sweep:   {days: [MO, TU, WE, TH, FR], time: "06:45", tz: America/Los_Angeles}
    task_triage:  {days: [MO, TU, WE, TH, FR], time: "07:30", tz: America/Los_Angeles}
    ask_nudges:   {days: [MO, TU, WE, TH, FR], time: "09:00", tz: America/Los_Angeles}
    daily:  {days: [MO, TU, WE, TH], time: "07:00", tz: America/Los_Angeles}
    friday: {days: [FR], time: "09:00", tz: America/Los_Angeles}

forecast:
  manager_update: {days: [FR], time: "12:00", tz: America/Los_Angeles}
  quarters: calendar              # Q3 = Jul 1 to Sep 30. coverage_check reads this
  amount_field: ARR__c            # sample revenue field, map to the actual CRM schema
  targets: {}                     # example only, configure approved quarterly targets during onboarding
  target_default: 250000         # fictional demo quarterly target
  # annual target is the sum of the configured quarterly targets
  tracking:
    forward_quarters: 2           # Monday pace report also shows coverage for the next two quarters
    created_arr_window_days: 7    # created ARR = ARR on Opportunities created in this window
    coverage_min: 3               # alert below 3x remaining gap
    pace_behind_alert_percent: 15
    pace_report: {days: [MO], time: "08:00", tz: America/Los_Angeles}
  next_quarter_preview_days: 21   # within this many days of quarter end, add the next quarter view
  sources: [salesforce, calendar, gmail, slack]   # freshest wins
  gmail_query: "from:@{domain} after:{date}"   # one per Account domain; fallback search by Contact name
  activity_days: 14               # activity from any source within this window counts as active
  forecast_category_map: {commit: Commit, upside: Best Case}   # ForecastCategoryName per bucket; excluded keeps its value
  schedule: {days: [FR], time: "10:00", tz: America/Los_Angeles}   # after the Friday pipeline review

pilot_usage:
  warehouse: EXAMPLE_READONLY_WH
  window_days: 60                                   # trailing days ending yesterday; SQL placeholder <window_days>
  top_users: 5                                      # report mode list and pdf computed bullet
  use_case_sample: 40                               # most recent distinct query strings; SQL placeholder <use_case_sample>
  use_case_themes_max: 5                            # report mode theme cap; consumed by the report format
  query_text_max_chars: 120                         # any query string shown anywhere, including the PDF
  # pdf mode: two-page customer deliverable built by pilot_usage_build from saved query results plus the approved review file
  pdf:
    report_title: Pilot Usage Report
    week_one_length_days: 7                         # week-one column of the user table; everything after through data_through is one After column
    task_grain: context_uuid                        # one Computer task = one context; asserted by compute
    credit_unit: cent                               # 1 credit = 1 cent of fct_billing_usage_asi.amount_cents; asserted by compute
    credit_display_rule: round_half_up_per_context_then_sum
    uncategorized_category_id: uncategorized
    uncategorized_label: Uncategorized
    uncategorized_description: Untitled or insufficient-evidence tasks.
    user_table_max_rows: 20                         # remaining users fold into one Other row
    confidentiality_label: Confidential
    category_palette: ["#20808D", "#A84B2F", "#1B474D", "#BCE2E7", "#944454", "#FFC553"]   # also the category cap
    page_count: 2
    page_size: Letter
    page_width_points: 612
    page_height_points: 792
    metadata_title: Example Product Pilot Usage Report
    metadata_author: Example Product
    chromium_timeout_seconds: 120
    output_dir: /tmp/pilot-usage                    # outputs never enter Project Files
    fonts:
      sans:
        family: DejaVu Sans
        file_name: DejaVuSans.ttf
        sha256: 7da195a74c55bef988d0d48f9508bd5d849425c1770dba5d7bfc6ce9ed848954
        pdf_name_token: DejaVuSans
        source_path: _core/assets/fonts/DejaVuSans.ttf
        url: bundle:DejaVuSans.ttf
      mono:
        family: DejaVu Sans Mono
        file_name: DejaVuSansMono.ttf
        sha256: b4a6c3e4faab8773f4ff761d56451646409f29abedd68f05d38c2df667d3c582
        pdf_name_token: DejaVuSansMono
        source_path: _core/assets/fonts/DejaVuSansMono.ttf
        url: bundle:DejaVuSansMono.ttf

close:
  signature_evidence: ["Paid_Contract_Signed__c = true", "Ironclad_Contract_Signed__c = true with ironclad_Contract_Signed_Date__c", "Signed_Contract_URL__c set", "a signed PDF the user supplies", "the user states signed in this thread"]   # workspaces/pipeline/workflows/close/CONTEXT.md
  path_order: [2, 3, 4, 5, 1]         # paths per workspaces/pipeline/workflows/close/references/paths.md, first match wins
  customer_type_stop: [Sovereign AI]   # Customer_Type__c values with no close flow: stop and ask
  win_note_min_chars: 50              # Salesforce validation on Closed_Won_Notes__c
  win_note_max_chars: 280             # each new Closed_Won_Notes__c and Use_Cases__c line
  followup_days: 7                    # Task due date after a handoff post or a pending downstream item
  ops_channel: C0000000001            # #enterprise-ops-systems
  ops_owners: [U0000000001, U0000000002]   # Operations owner A, Operations owner B
  deal_desk_channel: C0000000002      # approval needed for any billing cadence other than terms_default
  terms_default: {type: New Business, billing_interval: Annual, billing_terms: Net 30, contract_term_months: 12, subscription_type: Paid}
  price_books:
    annual: {name: Standard Price Book, annual_list: {max: 1200, pro: 600}}            # per seat per year
    pilot:  {name: Monthly Price Book, monthly_list: {max: 100, pro: 50}}              # unit prices are annualized (x12); actual charge = seats x monthly list x months
  credits: {product: Example Product Credits, unit_price: 0.01, discount: 0, bonus_product: Example Product Bonus Credits, bonus_unit_price: 0}   # quantity is cents; never discounted
  paid_pilot: {deal_type: Paid Trial, price_book: pilot, discount: 0, contract_term: pilot length in months, subscription_type: Paid}
  handoff_when: [self-serve org exists, more than one org, setup_trial declined or failed, Netsuite_Sync_Status__c FAILED, ADMIN_Error_Message__c set]
  setup_trial:                        # API equivalent of the Create Free Trial button. Steps in workspaces/pipeline/workflows/close/references/setup-trial.md
    trial_days: 1
    tier_default: pro
    flow_name: Example_Create_Organization
    payload: {Subscription_Type__c: Trial, Subscription_Billing_Interval__c: Annual, Subscription_Start_Date__c: today, Subscription_Deactivation_Date__c: today + trial_days, Trial_Expiration_Date__c: today + trial_days, Admin_Email__c: admin Contact email, Admin_Invite_Tier__c: tier_default, Sync_Free_Trial_to_ADMIN__c: true}
    poll: {every_seconds: 15, max_seconds: 60}
    success_fields: {ADMIN_Error_Message__c: null, Admin_Org_Subscription_Id__c: set, Account.Admin_Organization_UUID__c: set}
    restore_after: [Subscription_Type__c, Subscription_Billing_Interval__c, Subscription_Start_Date__c, Subscription_Deactivation_Date__c, Trial_Expiration_Date__c]

prospecting:
  # Compatibility settings copied from prospecting. Core rules own write authority.
  # prospect policy.prospecting. Chosen values. Workflows read this file at run start and never restate it.

  identity:
    owner_email: rep@seller.example
    sfdc_user_id: 005000000000001AAA
    timezone: America/Los_Angeles

  approval:
    # Each write needs its own numbered proposal and explicit approval in the thread, showing the exact fields. Approval for one never covers another. Each stage contract's Propose step names the fields.
    unattended_writes: false          # a scheduled run proposes, never writes
    readback_required: true           # every write is re-read from the system after it lands
    never: [send email outside rules#event_sequence, create Opportunity, change deal stage or amount]

  salesforce:
    open_opportunity: IsClosed = false

  scan:
    # signal-scan. Public evidence for a named account.
    quote_min_words: 5
    max_signals_per_account: 3
    warm_engagement:                      # route warm_engaged and stop. Another rep has a live thread.
      # window is outreach.activity_lookback_days
      task_subject_markers: ["Re:", "Email: << Re:"]       # case-insensitive. Second form is how the Salesforce email sync writes inbound replies
      task_owner: not identity.sfdc_user_id   # only Tasks owned by someone other than Operator count. Operator's own threads, Events, and invites never stop a scan
      ignored_owner_ids: []            # configure verified integration User IDs through onboarding, including Unify only if used

  warehouse:
    # Snowflake reads. Research Adoption. Read-only, async, fetch after status success.
    name: EXAMPLE_READONLY_WH
    data_lag_days: 1                   # Completed snapshot is today minus this in identity.timezone
    forbidden: [user names, user emails, user or seat counts, query content, activity timing]   # never selected, never reported, never in a file

  user_scan:
    # signal-user-scan. Org-level Example Product adoption facts for a Operator-owned Account with no open Opportunity.
    statements:                                    # the adoption fact outreach may state, keyed by bundle.adoption. Wording per talk-track.md Claim boundaries. none_found has no claim.
      org_adopted: Example Product is already adopted at the organization.
      individuals_only: People at the organization already pay for Example Product individually.
    adoption_values: [org_adopted, individuals_only, none_found]   # prospect_privacy_check.py verifies adoption is one of these and matches the rule below
    # adoption rule. org_adopted when org_subscribed, individuals_only when only paid_individuals_exist, else none_found
    bundle_keys:                                   # exact handoff shape. Key: type. Nothing else passes the check.
      account_name: str
      salesforce_account_id: str
      account_domain: str
      data_through_date: str
      mapped_org_count: int
      org_subscribed: bool
      org_paying: bool
      org_service_types: list
      org_platforms: list
      paid_individuals_exist: bool
      adoption: str                                # org_adopted | individuals_only | none_found

  event:
    # event-sequence. Operator's contact list into one approved Apollo sequence. No list size cap.
    exclude: [open_opportunity, outside_named_accounts, recent_reply, unverified_email, catch_all_email, active_sequence, event_app_invite]   # Named-account scope cannot be overridden
    recent_reply_days: 14            # a reply this recent gets a personal answer, not a sequence
    enrich: missing_or_unverified    # only contacts without a verified email go to enrichment
    enrich_order: [apollo_match, apollo_waterfall]   # each credit spend approved before it runs. Waterfall only for contacts with no verified email after apollo_match
    stop_on_reply: true              # Apollo finishes the contact on reply. Operator takes over
    steps: [email, email, linkedin_task]   # default touches. Copy approved per event
    step_gap_days: 3
    last_touch_before_event_days: 2
    outreach_owner_scope:
      house_owner_ids: []
      include_missing_account: false

  outreach:
    # signal-outreach. One Gmail draft from one qualified bundle. Never sends.
    bundle_checked_max_age_hours: 24   # elapsed time since checked_at (timestamp with offset) at draft time. published_date freshness comes from the signal type's taxonomy freshness_days
    suppression_days: 30               # per Contact, read on the Account and Contact. A completed Task of a suppressing subtype, any Event, or sent Gmail inside this window blocks. Inside means date >= today - suppression_days
    suppressing_task_subtypes: [Email, Call]   # LinkedIn connects and generic to-dos are reported, not suppressing
    activity_lookback_days: 30         # Salesforce Tasks and Events read on the Account and Contact
    max_drafts_per_run: 1
    recipient_sources: [existing Salesforce Contact with Email, prior Gmail thread with the person, Apollo verified, Operator supplied in this conversation]   # never infer an address or mislabel its source
    draft_shape: One verified observation, one relevant Example Product connection, one easy question. A few plain sentences; no self-introduction line such as "I work for Example Product"; no unsupported assumptions or benchmark statistics.
    lint: optional environment style review   # advisory style review; never overrides approved wording or evidence limits

  followup:
    # signal-followup. One open Salesforce Task after a proven Gmail send. Never creates the completed Email Task, the Gmail sync owns that.
    due_calendar_days: 7               # default. ActivityDate = Pacific send date + this
    max_tasks_per_run: 1
    task:
      Subject: "Follow up: {gmail_subject}"
      Status: Not Started
      Priority: Normal
      TaskSubtype: Task
      Description: "Follow up on signal-outreach email. Gmail message {message_id}; thread {thread_id}. signal_type {signal_type}; angle {angle}."   # the two ids let a Salesforce report grade signal types and angles later
      # WhatId = Account, OwnerId = identity.sfdc_user_id, WhoId = the one matching Contact. Type unset
    closed_statuses: [Completed, Deferred]
    # fail-closed conditions are the prospect_followup_gate.py docstring checks

system_review:
  schedule: {days: [FR], time: "14:00", tz: America/Los_Angeles}   # read-only health check and eval. run behaviour: rules#scheduled_runs
  preapproval:                     # evidence bar before Systems proposes a pre-approval rule. Each rule is its own rules.md change for Operator
    window_weeks: 4
    min_proposals: 20
    min_unchanged: 19              # approved with no edits
    max_rejections: 0

template:
  mode: unconfigured
  external_ready: false
  integrations: {}                     # every dependency needs an explicit onboarding choice and separate live verification
  auto_date_move: false
  company_name: Example Seller
  owner_name: Sales Operator
  product_name: Example Product
  product_value: Example Product helps a team coordinate a recurring business workflow.
  product_evidence: Fictional demonstration only. No verified product claim.
  product_review_date: '2026-10-04'
  icp: Business services with a recurring team workflow, named owner and measurable
    evaluation. Demo only.
  warehouse_timezone: America/Los_Angeles
