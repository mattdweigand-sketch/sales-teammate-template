# Flattened factory prospecting policy fixture. Event policy is tested separately.
identity:
  owner_email: rep@seller.example
  sfdc_user_id: 005000000000001AAA
  timezone: America/Los_Angeles
approval:
  unattended_writes: false
  readback_required: true
  never:
  - send email outside rules#event_sequence
  - create Opportunity
  - change deal stage or amount
salesforce:
  open_opportunity: IsClosed = false
scan:
  quote_min_words: 5
  max_signals_per_account: 3
  warm_engagement:
    task_subject_markers:
    - 'Re:'
    - 'Email: << Re:'
    - 'Email: >> Re:'
    task_owner: not identity.sfdc_user_id
    ignored_owner_ids: []
warehouse:
  name: EXAMPLE_READONLY_WH
  data_lag_days: 1
  forbidden:
  - user names
  - user emails
  - user or seat counts
  - query content
  - activity timing
user_scan:
  statements:
    org_adopted: Example Product is already adopted at the organization.
    individuals_only: People at the organization already pay for Example Product individually.
  adoption_values:
  - org_adopted
  - individuals_only
  - none_found
  bundle_keys:
    account_name: str
    salesforce_account_id: str
    account_domain: str
    data_through_date: str
    mapped_org_count: int
    org_subscribed: bool
    org_paying: bool
    org_service_types: list
    org_platforms: list
    paid_individuals_exist: bool
    adoption: str
outreach:
  bundle_checked_max_age_hours: 24
  suppression_days: 30
  suppressing_task_subtypes:
  - Email
  - Call
  activity_lookback_days: 30
  max_drafts_per_run: 1
  recipient_sources:
  - existing Salesforce Contact with Email
  - prior Gmail thread with the person
  - Apollo verified
  - Operator supplied in this conversation
  draft_shape: One verified observation, one relevant Example Product connection,
    one easy question. A few plain sentences; no self-introduction line such as "I
    work for Example Product"; no unsupported assumptions or benchmark statistics.
  lint: optional environment style review
followup:
  due_calendar_days: 7
  max_tasks_per_run: 1
  task:
    Subject: 'Follow up: {gmail_subject}'
    Status: Not Started
    Priority: Normal
    TaskSubtype: Task
    Description: Follow up on signal-outreach email. Gmail message {message_id}; thread
      {thread_id}. signal_type {signal_type}; angle {angle}.
  closed_statuses:
  - Completed
  - Deferred
