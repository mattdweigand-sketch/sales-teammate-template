name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r _core/requirements.txt playwright==1.63.0
      - name: Install PDF renderer
        run: python -m playwright install --with-deps chromium
      - name: Rehearse onboarding and all workflows
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B _core/scripts/rehearse.py --scratch "${{ runner.temp }}/sales-rehearsal"
      - name: Keep verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: sales-rehearsal
          path: |
            ${{ runner.temp }}/sales-rehearsal/report.*
            ${{ runner.temp }}/sales-rehearsal/*.log
            ${{ runner.temp }}/sales-rehearsal/artifacts/workflow-report.json
            ${{ runner.temp }}/sales-rehearsal/artifacts/demo-pilot-usage.pdf
